services:
  tests:
    profiles: [test]
    build:
      context: ./backend
    command: [python, -m, unittest, discover, -s, tests, -v]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend/tests:/app/tests:ro
      - ${PIPELINE_STATE_HOST_DIR:-./.pipeline}:/data/.pipeline
    user: "${PIPELINE_UID:-0}:${PIPELINE_GID:-0}"

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RAW_DIR: /data/raw
      OUTPUT_DIR: /data/output
      PIPELINE_DATA_DIR: /data/.pipeline
    volumes:
      - ${PIPELINE_RAW_HOST_DIR:-./raw}:/data/raw:ro
      - ${PIPELINE_OUTPUT_HOST_DIR:-./output}:/data/output
      - ${PIPELINE_STATE_HOST_DIR:-./.pipeline}:/data/.pipeline
    user: "${PIPELINE_UID:-0}:${PIPELINE_GID:-0}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./backend
    deploy:
      replicas: ${PIPELINE_WORKER_REPLICAS:-1}
    command:
      - python
      - -m
      - app.pipeline.jobs.worker
    environment:
      RAW_DIR: /data/raw
      PIPELINE_DATA_DIR: /data/.pipeline
      PIPELINE_WORKERS: ${PIPELINE_WORKERS:-1}
      PIPELINE_POLL_SECONDS: ${PIPELINE_POLL_SECONDS:-5}
      PIPELINE_OCR_ENABLED: ${PIPELINE_OCR_ENABLED:-1}
      PIPELINE_CODEX_MODEL: ${PIPELINE_CODEX_MODEL:-}
      PIPELINE_CODEX_EFFORT: ${PIPELINE_CODEX_EFFORT:-}
      PIPELINE_CODEX_TIMEOUT_SECONDS: ${PIPELINE_CODEX_TIMEOUT_SECONDS:-}
      PIPELINE_OCR_MAX_IMAGE_SIDE: ${PIPELINE_OCR_MAX_IMAGE_SIDE:-}
      PIPELINE_OCR_CAPACITY: ${PIPELINE_OCR_CAPACITY:-}
      CODEX_AUTH_FILE: /run/codex-auth/auth.json
      PIPELINE_CODEX_HOME: /tmp/pipeline-codex
    volumes:
      - ${PIPELINE_RAW_HOST_DIR:-./raw}:/data/raw:ro
      - ${PIPELINE_STATE_HOST_DIR:-./.pipeline}:/data/.pipeline
      - type: bind
        source: ${CODEX_AUTH_FILE_HOST:-${HOME:-.}/.codex/auth.json}
        target: /run/codex-auth/auth.json
        read_only: true
        bind:
          create_host_path: false
    user: "${PIPELINE_UID:-0}:${PIPELINE_GID:-0}"
    restart: unless-stopped
