services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RAW_DIR: /data/raw
      OUTPUT_DIR: /data/output
      PIPELINE_DATA_DIR: /data/.pipeline
    volumes:
      - ${PIPELINE_RAW_HOST_DIR:-./raw}:/data/raw:ro
      - ${PIPELINE_OUTPUT_HOST_DIR:-./output}:/data/output
      - ${PIPELINE_STATE_HOST_DIR:-./.pipeline}:/data/.pipeline
    user: "${PIPELINE_UID:-1000}:${PIPELINE_GID:-1000}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./backend
    command:
      - uv
      - run
      - --no-sync
      - python
      - -m
      - app.pipeline.jobs.worker
    environment:
      RAW_DIR: /data/raw
      PIPELINE_DATA_DIR: /data/.pipeline
      PIPELINE_WORKERS: ${PIPELINE_WORKERS:-2}
      PIPELINE_POLL_SECONDS: ${PIPELINE_POLL_SECONDS:-5}
    volumes:
      - ${PIPELINE_RAW_HOST_DIR:-./raw}:/data/raw:ro
      - ${PIPELINE_STATE_HOST_DIR:-./.pipeline}:/data/.pipeline
    user: "${PIPELINE_UID:-1000}:${PIPELINE_GID:-1000}"
    restart: unless-stopped
